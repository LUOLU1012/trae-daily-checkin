name: TRAE Daily Checkin

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - run: npm install puppeteer
      
      - name: Run checkin
        env:
          TRAE_COOKIE_STRING: ${{ secrets.TRAE_COOKIE_STRING }}
        run: node checkin-cloud-simple.js
